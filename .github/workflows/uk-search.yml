name: UK vacancy search
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s uk -p 'test_*.py'
      - run: python uk/run.py --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uk-vacancies
          path: results/
          retention-days: 7
